<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jogo da Cobra</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-shell">
      <h1>Cobra de Coração</h1>
      <div class="hud">
        <span>Pontos: <strong id="score">0</strong></span>
        <span id="status">Aperte as setas para jogar</span>
      </div>
      <canvas id="game-board" width="400" height="400" aria-label="Tabuleiro do jogo da cobra"></canvas>
    </main>

    <script src="script.js"></script>
  </body>
</html>
